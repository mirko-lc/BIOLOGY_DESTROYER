  '<form class="adm-card" id="admAdd" autocomplete="off"><h2>Add a student</h2><div class="adm-form"><div><label class="l" for="admNm">Student name</label><input id="admNm" placeholder="e.g. Arantza de Argumaniz"></div><div><label class="l" for="admDur">Access lasts</label><select id="admDur">'+DUR.filter(function(d){return d[0]!=="end";}).map(function(d){return '<option value="'+d[0]+'">'+d[1]+'</option>';}).join("")+'</select></div><div id="admCw" hidden><label class="l" for="admCdt">Ends on</label><input id="admCdt" type="datetime-local"></div><button class="btn" type="submit">Create code</button></div></form>'+
  '<div class="adm-card"><h2>Your teacher code</h2><p class="muted" style="margin:0 0 10px;font-weight:600">Make a new one if someone may have seen it. Write it down before publishing.</p><button class="adm-x" id="admNewT">Make a new teacher code</button></div>'+
  '<div class="adm-card"><h2>Publish directly to GitHub '+(tok?'<span class="adm-pill ok">Connected</span>':'<span class="adm-pill">Not connected</span>')+'</h2>'+
  '<p class="muted" style="margin:0 0 10px;font-weight:600">Connect once on this device and every change goes live with one tap. Without it, you download index.html and upload it to GitHub yourself.</p>'+
  '<div class="adm-form" style="grid-template-columns:1fr 1.4fr auto"><div><label class="l" for="admRepo">Repository (owner/name)</label><input id="admRepo" value="'+esc(repo)+'" placeholder="username/biohl-study"></div><div><label class="l" for="admTok">GitHub token</label><input id="admTok" type="password" placeholder="'+(tok?"Saved on this device":"github_pat_…")+'"></div><div class="adm-acts"><button class="adm-x" id="admTokSave" type="button">Save</button>'+(tok?'<button class="adm-x del" id="admTokDel" type="button">Disconnect</button>':'')+'</div></div>'+
  '<details style="margin-top:10px"><summary style="cursor:pointer;font-weight:800">How to get a token (2 minutes)</summary><ol><li>On github.com click your photo → <b>Settings</b> → <b>Developer settings</b> → <b>Personal access tokens</b> → <b>Fine-grained tokens</b> → <b>Generate new token</b>.</li><li>Name it "Codes", choose an expiration, and under <b>Repository access</b> pick <b>Only select repositories</b> → this app\'s repository.</li><li>Under <b>Permissions → Repository permissions</b>, set <b>Contents</b> to <b>Read and write</b>.</li><li>Click <b>Generate token</b>, copy it, paste it above and tap Save.</li></ol><p class="muted" style="font-weight:600">The token is kept only in this browser. Use it only on your own device.</p></details></div>'+
  '<div class="adm-msg" id="admMsg"></div></div>'+
  '<div class="adm-save"><div class="w"><b>'+(dirty?"You have unpublished changes.":"No unpublished changes.")+'</b><div class="adm-acts"><button class="btn ghost sm" id="admDl"'+(dirty?'':' disabled')+'>Download index.html</button>'+(tok?'<button class="btn pop sm" id="admPub"'+(dirty?'':' disabled')+'>Publish changes</button>':'')+'</div></div></div>';
  var q=function(s){return ov.querySelector(s);},qa=function(s){return Array.prototype.slice.call(ov.querySelectorAll(s));};

 function changed(t){dirty=true;draw();msg(t,"ok");}
 async function build(){
  if(!SRC){var r=await fetch("index.html?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error("Couldn't read index.html from the site.");SRC=await r.text();}
  var i=SRC.indexOf(MK1),j=SRC.indexOf(MK2);if(i<0||j<0)throw new Error("index.html has an unexpected format.");
  var key=await C.importKey("raw",K,"AES-GCM",false,["encrypt"]),e=[];
  for(var n=0;n<list.length;n++){var p=list[n];var kk=await kek(p.code,"encrypt");var iv=crypto.getRandomValues(new Uint8Array(12));
   var w=await C.encrypt({name:"AES-GCM",iv:iv,additionalData:aad(p.x,p.a)},kk,K);var iv2=crypto.getRandomValues(new Uint8Array(12));
   var m=await C.encrypt({name:"AES-GCM",iv:iv2},key,TE.encode(JSON.stringify({name:p.name,code:p.code})));e.push({w:b64(cat(iv,w)),x:p.x,a:p.a,m:b64(cat(iv2,m))});}
  var cfg=JSON.parse(JSON.stringify(CFG));cfg.e=e;
  return {text:SRC.slice(0,i+MK1.length)+JSON.stringify(cfg)+SRC.slice(j),cfg:cfg};
 }
 function done(cfg,t){CFG.e=cfg.e;dirty=false;list.forEach(function(p){delete p.isNew;});draw();msg(t,"ok");}
 async function download(){if(busy)return;busy=true;msg("Building…");try{var r=await build();var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([r.text],{type:"text/html"}));a.download="index.html";document.body.appendChild(a);a.click();a.remove();
   done(r.cfg,"Downloaded. Now upload index.html to your GitHub repository (Add file → Upload files → Commit changes). Live 1–2 minutes later.");}catch(e){msg(e.message||"Something went wrong.","err");}busy=false;}
 async function publish(){if(busy)return;busy=true;var tok=ls(TK),repo=(ls(RK)||guessRepo()).replace(/^\/+|\/+$/g,"");
  if(!repo||repo.indexOf("/")<0){msg("Type your repository as owner/name and tap Save.","err");busy=false;return;}
  msg("Publishing…");try{var r=await build();var api="https://api.github.com/repos/"+repo+"/contents/index.html",h={"Authorization":"Bearer "+tok,"Accept":"application/vnd.github+json"};
   var put=async function(){var g=await fetch(api+"?t="+Date.now(),{headers:h,cache:"no-store"});if(g.status===401)throw new Error("GitHub rejected the token. Make a new one and save it again.");if(g.status===404)throw new Error("Repository not found, or the token can't access it. Check owner/name and the token's repository access.");if(!g.ok)throw new Error("GitHub error "+g.status+".");var cur=await g.json();
     return fetch(api,{method:"PUT",headers:Object.assign({"Content-Type":"application/json"},h),body:JSON.stringify({message:"Update access codes",content:b64(TE.encode(r.text)),sha:cur.sha})});};
   var res=await put();if(res.status===409||res.status===422)res=await put();
   if(res.status===403)throw new Error("The token doesn't have permission to write. Set Contents to Read and write.");if(!res.ok)throw new Error("GitHub error "+res.status+". Try again, or use Download.");
   done(r.cfg,"Published! Changes go live in 1–2 minutes.");}catch(e){msg(e.message||"Couldn't reach GitHub. Try again, or use Download.","err");}busy=false;}
 return {init:init};
})();

function u8(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
function norm(c){return String(c).toUpperCase().replace(/[^A-Z0-9]/g,"");}
var dataP=null;
function getData(){if(!dataP)dataP=Promise.all(CFG.parts.map(function(p){return fetch(p+"?v="+CFG.ver).then(function(r){if(!r.ok)throw new Error("missing "+p);return r.arrayBuffer();});})).then(function(bs){var n=0;bs.forEach(function(b){n+=b.byteLength;});var a=new Uint8Array(n),o=0;bs.forEach(function(b){a.set(new Uint8Array(b),o);o+=b.byteLength;});return a;});return dataP;}
async function serverNow(){try{var r=await fetch("index.html?t="+Date.now(),{method:"HEAD",cache:"no-store"});var d=Date.parse(r.headers.get("date"));if(d)return d;}catch(e){}return Date.now();}
async function findEntry(code){
  var C=crypto.subtle;
  var base=await C.importKey("raw",new TextEncoder().encode(norm(code)),"PBKDF2",false,["deriveKey"]);
  var kek=await C.deriveKey({name:"PBKDF2",salt:u8(CFG.salt),iterations:CFG.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  for(var i=0;i<CFG.e.length;i++){var en=CFG.e[i],w=u8(en.w);
    try{var raw=await C.decrypt({name:"AES-GCM",iv:w.subarray(0,12),additionalData:new TextEncoder().encode(JSON.stringify([en.x,en.a]))},kek,w.subarray(12));return {raw:raw,x:en.x,a:en.a,i:i};}catch(e){}}
  return null;
}
async function openApp(raw){
  var C=crypto.subtle;var key=await C.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  var buf=new Uint8Array(await C.decrypt({name:"AES-GCM",iv:u8(CFG.iv)},key,await getData()));
  var hl=new DataView(buf.buffer).getUint32(0);var hdr=JSON.parse(new TextDecoder().decode(buf.subarray(4,4+hl)));
  var start=4+hl,html=new TextDecoder().decode(buf.subarray(start,start+hdr.htmlLen)),base=start+hdr.htmlLen,imgs={};
  Object.keys(hdr.imgs).forEach(function(k){var r=hdr.imgs[k];imgs[k]=URL.createObjectURL(new Blob([buf.subarray(base+r[0],base+r[0]+r[1])],{type:"image/webp"}));});
  window.__IMGS=imgs;return html;
}
function fmt(t){return new Date(t).toLocaleString(undefined,{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});}
var f=document.getElementById("f"),inp=document.getElementById("code"),msg=document.getElementById("msg"),btn=document.getElementById("go");
function fail(t){btn.disabled=false;btn.textContent="Unlock · Entrar";msg.textContent=t;inp.focus();}
async function attempt(code,remember){
  btn.disabled=true;btn.textContent="Opening… · Abriendo…";msg.textContent="";
  try{await getData();}catch(e){dataP=null;return fail("Couldn't download the app. Check your connection. · No se pudo descargar la app. Revisa tu conexión.");}
  var ent=null;try{ent=await findEntry(code);}catch(e){}
  if(!ent){try{localStorage.removeItem(KEY);}catch(e){}return fail("That code didn't work. · Ese código no funciona.");}
  if(ent.x){var now=await serverNow();if(now>=ent.x){try{localStorage.removeItem(KEY);}catch(e){}return fail("Your access ended on "+fmt(ent.x)+". · Tu acceso terminó. Contact / Contacta a Mr. A. Agurto.");}}
  var html=null;try{html=await openApp(ent.raw);}catch(e){}
  if(!html)return fail("Something went wrong. Reload the page. · Algo salió mal. Recarga la página.");
  try{remember?localStorage.setItem(KEY,code):localStorage.removeItem(KEY);}catch(e){}
  if(ent.x){var left=ent.x-Date.now();if(left<2147483000)setTimeout(function(){location.reload();},Math.max(left,1000));}
  var nm="";try{var kk=await crypto.subtle.importKey("raw",ent.raw,"AES-GCM",false,["decrypt"]);var mm=u8(CFG.e[ent.i].m);nm=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:mm.subarray(0,12)},kk,mm.subarray(12)))).name;}catch(e){}
  window.__ACCESS={x:ent.x||0,a:ent.a||0,name:nm};
  document.open();document.write(html);document.close();
  if(ent.a)setTimeout(function(){Admin.init(ent.raw);},50);
}
f.addEventListener("submit",function(e){e.preventDefault();var c=inp.value.trim();if(!c){msg.textContent="Type your access code first. · Escribe primero tu código.";return;}attempt(c,document.getElementById("rem").checked);});
if(!window.crypto||!crypto.subtle){msg.textContent="This browser can't open the app. Please use an up-to-date Chrome, Safari, Edge or Firefox.";btn.disabled=true;return;}
getData().catch(function(){});
var saved=null;try{saved=localStorage.getItem(KEY);}catch(e){}
if(saved){inp.value=saved;attempt(saved,true);}else inp.focus();
})();
